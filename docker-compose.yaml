services:
  postgres:
    image: postgres:16
    container_name: artship-postgres
    environment:
      POSTGRES_DB: artshipboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hisamo3485043
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - artship-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artshipboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend/board
    container_name: artship-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/artshipboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: hisamo3485043
    networks:
      - artship-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build: ./frontend
    container_name: artship-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8081/api
      VITE_WS_URL: http://localhost:8081/ws
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - artship-network

networks:
  artship-network:
    driver: bridge

volumes:
  postgres-data:
  uploads-data: